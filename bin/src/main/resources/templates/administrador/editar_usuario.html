<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuario | JustMe</title>
    <link rel="stylesheet" th:href="@{/assetsADMIN/styles/style.css}">
</head>
<body>
    <div class="app">
        <!-- SIDEBAR IZQUIERDA -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo">JM</div>
                <div class="brand-text">
                    <span class="brand-title">Just<span class="accent">Me</span></span>
                    <span class="brand-sub">Panel Admin</span>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle">☰</button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Opciones</div>
                <nav class="menu">
                    <a class="menu-item" th:href="@{/administrador}">
                        <span class="dot"></span> Panel
                    </a>
                    <a class="menu-item" th:href="@{/cerrar}">
                        <span class="dot"></span> Cerrar Sesión
                    </a>
                </nav>
            </div>

            <div class="sidebar-footer">
                <div class="mini-logo">⟡</div>
                <div class="footer-text">JustMe ©</div>
            </div>
        </aside>

        <!-- OVERLAY PARA MÓVIL -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main">
            <header class="topbar">
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                <div class="crumbs">Usuarios / <span>Editar usuario</span></div>
                <div class="top-actions">
                    <div class="avatar" title="Admin">A</div>
                </div>
            </header>

            <section class="services-section">
                <div class="container">
                    <div class="section-header">
                        <h3>Editar usuario</h3>
                    </div>
                    <div class="card col-2">
                        <div class="wrap">
                            <section class="panel">
                                <form th:action="@{/administrador/usuarios/guardar}" th:object="${usuario}"
                                    method="post">
                                    <input type="hidden" th:field="*{id}" />
                                    <div style="display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px;">
                                        <div>
                                            <div class="form-group">
                                                <label>Nombre</label>
                                                <input type="text" th:field="*{nombre}" required />
                                            </div>
                                            <div class="form-group">
                                                <label>Apellido</label>
                                                <input type="text" th:field="*{apellido}" required />
                                            </div>
                                            <div class="form-group">
                                                <label>Email</label>
                                                <input type="email" th:field="*{email}" required />
                                            </div>
                                            <div class="form-group">
                                                <label>Número</label>
                                                <input type="text" th:field="*{numero}" />
                                            </div>
                                            <div class="form-group">
                                                <label>Dirección</label>
                                                <input type="text" th:field="*{direccion}" />
                                            </div>
                                        </div>
                                        <div>
                                            <div class="form-group">
                                                <label>Documento</label>
                                                <input type="text" th:field="*{documentos}" />
                                            </div>
                                            <div class="form-group">
                                                <label>Biografía</label>
                                                <input type="text" th:field="*{biografia}" />
                                            </div>
                                            <div class="form-group">
                                                <label>Estado</label>
                                                <input type="text" th:field="*{estado}" />
                                            </div>
                                            <div class="form-group">
                                                <label>Rol</label>
                                                <select name="rolId">
                                                    <option th:each="r : ${roles}" th:value="${r.idrol}"
                                                        th:text="${r.nombre}"
                                                        th:selected="${usuario.rol != null and usuario.rol.idrol == r.idrol}"></option>
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label>Nueva contraseña (opcional)</label>
                                                <input type="password" name="nuevaContrasena" />
                                            </div>

                                        </div>
                                    </div>
                                    <div class="toolbar" style="margin-top: 16px; display:flex; gap:8px;">
                                        <button type="submit" class="btn-edit">Guardar</button>
                                        <a th:href="@{/administrador}" class="btn-delete">Cancelar</a>
                                    </div>
                                </form>
                            </section>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- SIDEBAR DERECHA SIMPLE -->
        <aside class="rightbar">
            <div class="card">
                <h3>Acciones rápidas</h3>
                <ul class="activity">
                    <li><span class="avatar sm">U</span><span>Edición de usuario</span></li>
                </ul>
            </div>
        </aside>
    </div>

    <script th:src="@{/assetsADMIN/scripts/script.js}"></script>
</body>
</html>

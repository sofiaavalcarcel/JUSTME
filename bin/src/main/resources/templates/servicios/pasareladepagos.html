<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Premium - Stripe</title>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/styles/pasarela_pagos.css}"/>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

 
</head>

<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="checkout-container">
        <!-- Columna izquierda - Formulario de pago -->
        <div class="checkout-form">
            <!-- Detalles de pago -->
            <div class="form-section">
                <h2 class="section-title">Detalles de Pago</h2>
                
                <!-- Vista previa de la tarjeta con efecto flip -->
                <div class="card-preview-container" id="card-preview-container">
                    <div class="card-inner">
                        <!-- Frente de la tarjeta -->
                        <div class="card-front" id="card-front">
                            <div class="card-chip"></div>
                            <div class="card-number" id="card-number-preview">•••• •••• •••• ••••</div>
                            <div class="card-bottom">
                                <div class="card-info">
                                    <div class="card-label">VENCE</div>
                                    <div class="card-expiry" id="card-expiry-preview">MM/AA</div>
                                </div>
                                <div class="card-logo">STRIPE</div>
                            </div>
                        </div>

                        <!-- Reverso de la tarjeta -->
                        <div class="card-back">
                            <div class="card-magnetic-strip"></div>
                            <div class="card-cvc-strip">
                                <div class="card-cvc-display" id="card-cvc-back-preview">•••</div>
                            </div>
                            <div style="flex: 1;"></div>
                            <div class="card-logo">STRIPE</div>
                        </div>
                    </div>
                </div>

                <form id="payment-form">
                    <!-- Número de tarjeta -->
                    <div class="form-group">
                        <label for="card-number-element">Número de Tarjeta</label>
                        <div id="card-number-element" class="card-element"></div>
                    </div>

                    <!-- Fecha de vencimiento y CVC en la misma fila -->
                    <div class="field-row">
                        <div class="form-group">
                            <label for="card-expiry-element">Fecha de Vencimiento</label>
                            <div id="card-expiry-element" class="card-element"></div>
                        </div>
                        <div class="form-group cvc-field">
                            <label for="card-cvc-element">CVC</label>
                            <div id="card-cvc-element" class="card-element"></div>
                        </div>
                    </div>

                    <div class="button-container">
                        <button id="submit" class="pay-button" type="submit">
                            <span id="button-text">Pagar Ahora</span>
                        </button>

                        <a th:href="@{/inicio}" class="cancel-button">
                            <span>Cancelar</span>
                        </a>
                    </div>

                    <p id="payment-message" class="hidden"></p>
                </form>

              
            </div>
        </div>

        <!-- Columna derecha - Resumen -->
        <div class="order-summary">
            <h2 class="summary-title">Resumen del servicio</h2>

            <!-- Información del servicio desde el backend -->
            <div class="summary-item">
                <div class="item-details">
                    <span class="item-code" th:text="${servicio.categoria}">Categoría</span>
                    <span class="item-name" th:text="${servicio.nombre_servicios}">Nombre del Servicio</span>
                </div>
                <div class="item-price" th:text="${'$' + #numbers.formatDecimal(servicio.precio_base, 0, 'POINT', 2, 'COMMA')}">$0.00</div>
            </div>

            <div class="summary-item">
                <div class="item-details">
                    <span class="item-code">Descripción</span>
                    <span class="item-name" th:text="${servicio.descripcion}">Descripción del servicio</span>
                </div>
            </div>

            <div class="coupon-section">
                <label for="service-datetime">Escoja fecha y hora del servicio</label>
                <div class="coupon-input">
                    <input type="datetime-local" id="service-datetime">
                </div>
            </div>

            <div class="coupon-section">
                <label for="coupon">Cupón</label>
                <div class="coupon-input">
                    <input type="text" id="coupon" placeholder="Ingrese un cupón">
                    <button class="apply-btn" type="button">Aplicar</button>
                </div>
            </div>

            <div class="summary-total">
                <div class="total-row">
                    <span>Subtotal</span>
                    <span id="subtotal-amount" th:text="${'$' + #numbers.formatDecimal(servicio.precio_base, 0, 'POINT', 2, 'COMMA')}">$0.00</span>
                </div>
                <div class="total-row">
                    <span>Descuento</span>
                    <span id="discount-amount">$0</span>
                </div>
                <div class="total-row grand-total">
                    <span>Total</span>
                    <span id="total-amount" th:text="${'$' + #numbers.formatDecimal(servicio.precio_base, 0, 'POINT', 2, 'COMMA')}">$0.00</span>
                </div>
            </div>

            <div class="secure">
                <img src="https://cdn-icons-png.flaticon.com/512/942/942799.png" alt="Seguridad" />
                <p>Pago seguro procesado por <strong>Stripe</strong></p>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const servicePrice = /*[[${servicio.precio_base}]]*/ 0;
        const serviceId = /*[[${servicio.id}]]*/ 0;
    </script>

    <script>
        // Clave pública de prueba de Stripe
        const stripe = Stripe("pk_test_51SO0JaPlW1idieMBuFaLL5AyDp3bSKgMj0KddfZd4yRRtB36wwJzIXWVgTPufftpFfT81ra2iDGkHtS8qA79ReOf00M4qhTfnE");

        // Configuración de elementos de Stripe
        const elements = stripe.elements();

        // Estilos personalizados para los elementos
        const elementStyles = {
            base: {
                color: '#32325d',
                fontFamily: '"Inter", sans-serif',
                fontSmoothing: 'antialiased',
                fontSize: '16px',
                '::placeholder': {
                    color: '#aab7c4'
                }
            },
            invalid: {
                color: '#fa755a',
                iconColor: '#fa755a'
            }
        };

        // Crear elementos de Stripe separados
        const cardNumber = elements.create('cardNumber', {
            style: elementStyles,
            placeholder: '1234 1234 1234 1234'
        });

        const cardExpiry = elements.create('cardExpiry', {
            style: elementStyles,
            placeholder: 'MM/AA'
        });

        const cardCvc = elements.create('cardCvc', {
            style: elementStyles,
            placeholder: 'CVC'
        });

        // Montar elementos
        cardNumber.mount('#card-number-element');
        cardExpiry.mount('#card-expiry-element');
        cardCvc.mount('#card-cvc-element');

        // Referencias a elementos de la vista previa
        const cardPreviewContainer = document.getElementById('card-preview-container');
        const cardFront = document.getElementById('card-front');
        const cardNumberPreview = document.getElementById('card-number-preview');
        const cardExpiryPreview = document.getElementById('card-expiry-preview');
        const cardCvcPreview = document.getElementById('card-cvc-preview');
        const cardCvcBackPreview = document.getElementById('card-cvc-back-preview');

        // Función para formatear número de tarjeta con caracteres ocultos
        function formatCardNumber(value) {
            if (!value || value.length < 4) return '•••• •••• •••• ••••';

            const visibleDigits = value.slice(-4);
            const hiddenPart = '•••• •••• •••• ';
            return hiddenPart + visibleDigits;
        }

        // Actualizar vista previa de la tarjeta con animaciones
        cardNumber.on('change', (event) => {
            if (event.empty) {
                cardNumberPreview.textContent = '•••• •••• •••• ••••';
            } else {
                cardNumberPreview.textContent = formatCardNumber(event.value);
            }

            // Animación cuando se está escribiendo
            if (event.empty || event.complete) {
                cardFront.classList.remove('active');
            } else {
                cardFront.classList.add('active');
            }
        });

        cardExpiry.on('change', (event) => {
            const display = event.empty ? 'MM/AA' : event.value;
            cardExpiryPreview.textContent = display;
        });

        cardCvc.on('change', (event) => {
            const display = event.empty ? '•••' : '•'.repeat(event.value.length);
            cardCvcPreview.textContent = display;
            cardCvcBackPreview.textContent = display;
        });

        // Efectos de focus en los elementos - voltear tarjeta para CVC
        cardNumber.on('focus', () => {
            cardPreviewContainer.classList.remove('flipped');
            cardFront.classList.add('active');
        });

        cardExpiry.on('focus', () => {
            cardPreviewContainer.classList.remove('flipped');
            cardFront.classList.add('active');
        });

        cardCvc.on('focus', () => {
            cardPreviewContainer.classList.add('flipped');
            cardFront.classList.remove('active');
        });

        cardNumber.on('blur', () => {
            // No voltear automáticamente al perder el foco
        });

        cardExpiry.on('blur', () => {
            // No voltear automáticamente al perder el foco
        });

        cardCvc.on('blur', () => {
            // Voltear de nuevo al frente después de un breve delay
            setTimeout(() => {
                if (document.activeElement !== document.getElementById('card-cvc-element')) {
                    cardPreviewContainer.classList.remove('flipped');
                }
            }, 500);
        });

        const form = document.getElementById("payment-form");
        const message = document.getElementById("payment-message");
        const button = document.getElementById("submit");
        const serviceDateTimeInput = document.getElementById("service-datetime");

        // Establecer el mínimo permitido para la fecha/hora (ahora mismo)
        if (serviceDateTimeInput) {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const minValue = `${year}-${month}-${day}T${hours}:${minutes}`;
            serviceDateTimeInput.min = minValue;
        }

        // Variables de precio y elementos del resumen (para manejar cupones)
        let originalPrice = servicePrice;
        let discountAmount = 0;
        let finalPrice = originalPrice;
        let couponApplied = false;

        const subtotalAmountEl = document.getElementById('subtotal-amount');
        const discountAmountEl = document.getElementById('discount-amount');
        const totalAmountEl = document.getElementById('total-amount');
        const couponInput = document.getElementById('coupon');

        function formatCurrency(amount) {
            if (isNaN(amount)) return '$0.00';
            return '$' + amount.toLocaleString('es-CO', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            // Validar que el usuario haya escogido fecha y hora
            const serviceDateTime = serviceDateTimeInput.value;
            if (!serviceDateTime) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Fecha y hora requeridas',
                    text: 'Por favor selecciona la fecha y hora en la que deseas el servicio.',
                    confirmButtonColor: '#8b5cf6',
                    background: 'var(--card-bg)',
                    color: 'var(--dark-color)'
                });
                return;
            }

            // Validar que la fecha/hora no sea en el pasado
            const selected = new Date(serviceDateTime);
            const now = new Date();
            if (selected.getTime() < now.getTime()) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Fecha inválida',
                    text: 'La fecha y hora del servicio no puede ser en el pasado.',
                    confirmButtonColor: '#8b5cf6',
                    background: 'var(--card-bg)',
                    color: 'var(--dark-color)'
                });
                return;
            }

            button.disabled = true;
            button.classList.add('loading');
            button.innerHTML = '<span id="button-text">Procesando...</span>';

            try {
                // Primero crear el Payment Intent en el servidor
                const res = await fetch("/api/stripe/create-payment-intent", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        amount: Math.round(finalPrice * 100), // Convertir a centavos (con descuento si aplica)
                        currency: 'cop'
                    })
                });

                if (!res.ok) {
                    throw new Error('Error al crear el payment intent');
                }

                const {clientSecret} = await res.json();

                // Confirmar el pago con los elementos de la tarjeta
                const {error, paymentIntent} = await stripe.confirmCardPayment(clientSecret, {
                    payment_method: {
                        card: cardNumber,
                        billing_details: {
                            // Aquí puedes agregar detalles de facturación si los tienes
                        }
                    }
                });

                if (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error en el pago',
                        text: error.message,
                        confirmButtonColor: '#8b5cf6',
                        background: 'var(--card-bg)',
                        color: 'var(--dark-color)'
                    });
                    button.disabled = false;
                    button.classList.remove('loading');
                    button.innerHTML = '<span id="button-text">Pagar Ahora</span>';
                } else if (paymentIntent.status === "succeeded") {
                    try {
                        await fetch("/api/stripe/registrar-pago", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                servicioId: serviceId,
                                amount: finalPrice,
                                currency: 'cop',
                                paymentIntentId: paymentIntent.id,
                                status: paymentIntent.status,
                                serviceDateTime: serviceDateTime
                            })
                        });
                    } catch (e) {
                        console.error('Error registrando el pago en el backend', e);
                    }

                    Swal.fire({
                        icon: 'success',
                        title: '¡Pago completado!',
                        html: '<div style="font-size:14px; margin-top:8px;">' +
                              '<p style="margin:4px 0;">Tu pago se procesó correctamente.</p>' +
                              '<p style="margin:4px 0; opacity:0.9;">Estamos creando tu cita y en unos segundos te llevaremos al inicio.</p>' +
                              '</div>',
                        background: 'var(--card-bg)',
                        color: 'var(--dark-color)',
                        confirmButtonColor: '#8b5cf6',
                        showConfirmButton: false,
                        timer: 2600,
                        timerProgressBar: true,
                        backdrop: 'rgba(15,23,42,0.55)',
                        didOpen: () => {
                            const popup = Swal.getPopup();
                            if (popup) {
                                popup.style.borderRadius = '18px';
                                popup.style.boxShadow = '0 18px 60px rgba(15,23,42,0.35)';
                            }
                        }
                    }).then(() => {
                        // Redirigir a /inicio después del pago exitoso
                        window.location.href = '/inicio';
                    });
                }
            } catch (err) {
                console.error('Error:', err);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Ha ocurrido un error inesperado. Inténtalo de nuevo.',
                    confirmButtonColor: '#8b5cf6',
                    background: 'var(--card-bg)',
                    color: 'var(--dark-color)'
                });
                button.disabled = false;
                button.classList.remove('loading');
                button.innerHTML = '<span id="button-text">Pagar Ahora</span>';
            }
        });

        // Manejo del cupón JUSTME (10% descuento)
        document.querySelector('.apply-btn').addEventListener('click', function (e) {
            e.preventDefault();
            const rawCode = couponInput ? couponInput.value.trim() : '';
            const couponCode = rawCode.toUpperCase();

            if (!couponCode) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Cupón vacío',
                    text: 'Por favor ingresa un código de cupón válido.',
                    confirmButtonColor: '#8b5cf6',
                    background: 'var(--card-bg)',
                    color: 'var(--dark-color)'
                });
                return;
            }

            if (couponCode === 'JUSTME') {
                if (couponApplied) {
                    Swal.fire({
                        icon: 'info',
                        title: 'Cupón ya aplicado',
                        text: 'El cupón JUSTME ya fue aplicado al total.',
                        confirmButtonColor: '#8b5cf6',
                        background: 'var(--card-bg)',
                        color: 'var(--dark-color)'
                    });
                    return;
                }

                couponApplied = true;
                discountAmount = originalPrice * 0.10;
                finalPrice = originalPrice - discountAmount;

                if (discountAmountEl) {
                    discountAmountEl.textContent = '-' + formatCurrency(discountAmount);
                }
                if (totalAmountEl) {
                    totalAmountEl.textContent = formatCurrency(finalPrice);
                }

                Swal.fire({
                    icon: 'success',
                    title: 'Cupón aplicado',
                    text: 'Se aplicó un 10% de descuento con el cupón JUSTME.',
                    confirmButtonColor: '#8b5cf6',
                    background: 'var(--card-bg)',
                    color: 'var(--dark-color)'
                });
            } else {
                Swal.fire({
                    icon: 'warning',
                    title: 'Cupón inválido',
                    text: 'Este código de cupón no es válido.',
                    confirmButtonColor: '#8b5cf6',
                    background: 'var(--card-bg)',
                    color: 'var(--dark-color)'
                });
            }
        });

        // Manejar errores de validación en tiempo real
        cardNumber.on('change', (event) => {
            if (event.error) {
                console.log('Error en número de tarjeta:', event.error.message);
            }
        });

        cardExpiry.on('change', (event) => {
            if (event.error) {
                console.log('Error en fecha:', event.error.message);
            }
        });

        cardCvc.on('change', (event) => {
            if (event.error) {
                console.log('Error en CVC:', event.error.message);
            }
        });

        // Animación adicional para elementos al cargar
        document.addEventListener('DOMContentLoaded', function () {
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                card.style.animationDelay = `${index * 0.1}s`;
            });
        });
    </script>
</body>

</html>

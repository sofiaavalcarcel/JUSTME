<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña - JUSTME</title>
    <style>
        :root {
            --primary-color: #e16bff;
            --primary-dark: #9033a7;
            --secondary-color: #e16bff;
            --dark-color: #333;
            --light-color: #f8f9fa;
            --gray-color: #6c757d;
            --light-gray: #e9ecef;
            --white: #fff;
            --black: #000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

		/* === FONDO CON IMAGEN DE BELLEZA === */
		body {
		    margin: 0;
		    padding: 0;
		    color: var(--dark-color);
		    line-height: 1.3;
		    min-height: 100vh;
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    padding: 20px;
		    overflow: hidden;
		    background-image: url('https://img.freepik.com/fotos-premium/fondo-blanco-productos-belleza-flores_230068-11231.jpg');
		    background-size: cover;
		    background-position: center;
		    background-repeat: no-repeat;
		    position: relative;
		}

		/* Capa overlay para mejorar legibilidad */
		body::before {
		    content: '';
		    position: absolute;
		    top: 0;
		    left: 0;
		    right: 0;
		    bottom: 0;
		    background: rgba(255, 255, 255, 0.85);
		    backdrop-filter: blur(8px);
		    z-index: -1;
		}
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--white);
        }

        .card h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
            color: var(--black);
        }

        .card p {
            text-align: center;
            color: var(--black);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--black);
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgb(128, 0, 128);
            background: rgba(255, 255, 255, 0.07);
            color: var(--white);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(225, 107, 255, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .modal-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: var(--white);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 15px rgba(225, 107, 255, 0.4);
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
        }

        .signup-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            background-color: rgba(220, 53, 69, 0.2);
            color: #f8d7da;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }

        .success-message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            background-color: rgba(40, 167, 69, 0.2);
            color: #d4edda;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 25px;
            }
            
            .card h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="card">
            <h2>Recuperar contraseña</h2>
            <p>Ingresa el correo con el que te registraste y te enviaremos un código de recuperación.</p>

            <form th:action="@{/recuperar-contrasena}" method="post">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu@correo.com" required />
                </div>

                <p class="error-message" th:if="${param.error} == 'notfound'">
                    No encontramos un usuario registrado con ese correo.
                </p>

                <p class="success-message" th:if="${param.success}">
                    Hemos enviado un código de recuperación a tu correo.
                </p>

                <button type="submit" class="modal-btn">Enviar código</button>
            </form>

            <p class="signup-link">
                <a th:href="@{/}">Volver al inicio</a>
            </p>
        </div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Just Me - Editar Cita</title>
	<link rel="stylesheet" th:href="@{/styles/profesional.css}">
	<link rel="stylesheet" th:href="@{/styles/editar.css}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

	<!-- SweetAlert2 -->
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
	<!-- Header -->
	<header class="header">
		<div class="container">
			<div class="logo">
				<h1>Just Me</h1>
			</div>

			<nav class="nav">
				<ul>
					<li><a th:href="@{/profesional}"><i class="fas fa-home"></i> Inicio</a></li>
					<li><a href="#"><i class="fas fa-calendar-alt"></i> Agenda</a></li>
					<li><a href="#"><i class="fas fa-comments"></i> Comentarios</a></li>
					<li><a href="#"><i class="fas fa-chart-line"></i> Estadísticas</a></li>
				</ul>
			</nav>
		</div>
	</header>

	<!-- Main Content -->
	<main class="main">
		<div class="container">
			<div class="back-button-container">
				<a th:href="@{/profesional}" class="back-button">
					<i class="fas fa-arrow-left"></i> Volver al panel
				</a>
			</div>

			<div class="edit-service-card">
				<div class="card-header">
					<h2><i class="fas fa-edit"></i> Editar Cita</h2>
					<p>Actualiza la información de la cita seleccionada</p>
				</div>

				<!-- Formulario de edición -->
				<form id="formEditarCita" th:action="@{/citas/actualizar}" th:object="${cita}" method="post"
					class="edit-service-form">

					<!-- ✅ ID de la cita -->
					<input type="hidden" th:field="*{idCita}" />

					<!-- ✅ ID del servicio asociado -->
					<input type="hidden" th:if="*{servicio != null}" th:field="*{servicio.idservicios}" />


					<div class="form-row">
						<div class="form-group">
							<label for="fechaHora"><i class="fa-solid fa-clock"></i> Fecha y Hora</label>
							<input type="datetime-local" th:field="*{fechaHora}" id="fechaHora" required>
						</div>

						<div class="form-group">
							<label for="direccion"><i class="fa-solid fa-road"></i> Dirección</label>
							<input type="text" th:field="*{direccion}" id="direccion" required>
						</div>
					</div>

					<div class="form-row">
						<div class="form-group">
							<label for="precio"><i class="fas fa-dollar-sign"></i> Precio</label>
							<input type="number" step="0.01" th:field="*{precio}" id="precio" required>
						</div>

						<div class="form-group">
							<label for="estado"><i class="fas fa-toggle-on"></i> Estado</label>
							<select th:field="*{estado}" id="estado" required>
								<option value="" disabled>Seleccione un estado</option>
								<option value="Pendiente">Pendiente</option>
								<option value="Confirmada">Confirmada</option>
								<option value="Cancelada">Cancelada</option>
							</select>
						</div>
					</div>

					<!-- Removed observations and edit date as they are not in Citas entity yet -->

					<div class="form-actions">
						<a th:href="@{/profesional}" class="btn-secondary">Cancelar</a>
						<button type="submit" class="btn-primary">
							<i class="fas fa-save"></i> Actualizar Cita
						</button>
					</div>
				</form>
			</div>
		</div>
	</main>

	<!-- SweetAlert Script -->
	<script>
		document.getElementById("formEditarCita").addEventListener("submit", function (event) {
			event.preventDefault(); // evita que se envíe automáticamente

			Swal.fire({
				title: '¿Guardar cambios?',
				text: "¿Deseas guardar los cambios realizados en esta cita?",
				icon: 'question',
				showCancelButton: true,
				confirmButtonColor: '#3085d6',
				cancelButtonColor: '#d33',
				confirmButtonText: 'Sí, guardar',
				cancelButtonText: 'Cancelar'
			}).then((result) => {
				if (result.isConfirmed) {
					this.submit(); // envía el formulario
				}
			});
		});
	</script>
</body>
</html>

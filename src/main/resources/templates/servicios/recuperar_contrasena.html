<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña - JUSTME</title>
    <link rel="stylesheet" th:href="@{/styles/principal.css}">
</head>
<body>
    <section class="hero" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="card" style="max-width: 400px; width: 100%; padding: 2rem;">
            <h2>Recuperar contraseña</h2>
            <p>Ingresa el correo con el que te registraste y te enviaremos un código de recuperación.</p>

            <form th:action="@{/recuperar-contrasena}" method="post">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required />
                </div>

                <p class="error-message" th:if="${param.error} == 'notfound'">
                    No encontramos un usuario registrado con ese correo.
                </p>

                <p class="success-message" th:if="${param.success}">
                    Hemos enviado un código de recuperación a tu correo.
                </p>

                <button type="submit" class="modal-btn">Enviar código</button>
            </form>

            <p class="signup-link" style="margin-top: 1rem;">
                <a th:href="@{/}">Volver al inicio</a>
            </p>
        </div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registrar</title>
	<link rel="stylesheet" href="/styles/registrar.css" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>

<body>
	<header>
		<nav>
			<div class="card">
				<div class="loader">
					<p>Just</p>
					<div class="words">
						<span class="word">Me</span>
						<span class="word">Beauty</span>
						<span class="word">Me</span>
						<span class="word">Stylish</span>
						<span class="word">Me</span>
					</div>
				</div>
			</div>
		</nav>
	</header>

	<div class="main-content">
		<div class="register-container">
			<h2>Crear Cuenta</h2>

			<!-- FORMULARIO CORRECTO -->
			<form th:action="@{/save}" th:object="${usuario}" method="post">
				<div class="form-group">
					<label for="nombre">Nombre</label>
					<input type="text" th:field="*{nombre}" required />
				</div>

				<div class="form-group">
					<label for="apellido">Apellido</label>
					<input type="text" th:field="*{apellido}" required />
				</div>

				<div class="form-group">
					<label for="numero">Numero</label>
					<input type="number" th:field="*{numero}" required />
				</div>

				<div class="form-group">
					<label for="email">Correo Electrónico</label>
					<input type="email" th:field="*{email}" required />
				</div>

				<div class="form-group">
					<label for="direccion">Dirección</label>
					<input type="text" th:field="*{direccion}" required />
				</div>

				<div class="form-group">
					<label for="documentos">Documento de Identidad</label>
					<input type="text" th:field="*{documentos}" required />
				</div>

				<div class="form-group">
					<label for="documentos">Acerca de ti (Opcional)</label>
					<input type="text" th:field="*{biografia}"/>
				</div>

				<div class="form-group">
					<label for="contrasena">Contraseña</label>
					<input type="password" th:field="*{contrasena}" required />
				</div>



				<button type="submit" class="animated-button">Registrarse</button>
			</form>
		</div>
	</div>
</body>

</html>
